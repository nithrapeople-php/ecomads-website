[build]
  command = "npm run build"
  publish = "dist"

# Pretty URLs without .html (optional Netlify feature is on by default)
[[redirects]]
  from = "/services"
  to = "/services.html"
  status = 200

[[redirects]]
  from = "/approach"
  to = "/approach.html"
  status = 200

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 200

[[redirects]]
  from = "/thanks"
  to = "/thanks.html"
  status = 200
